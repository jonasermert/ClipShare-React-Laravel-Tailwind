services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD in .env setzen}
      MYSQL_DATABASE: ${DB_DATABASE:-clipshare}
      MYSQL_USER: ${DB_USERNAME:-clipshare}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
